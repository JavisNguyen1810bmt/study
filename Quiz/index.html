<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Namhoang00bmt</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
    padding: 15px 10px;
    margin: 0;
    min-height: 100vh;
}

/* PLAYER BOX */
.player-box {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
}

.player {
    padding: 10px 24px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 18px;
    background: #00e5ff;
    color: black;
    box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
}

/* QUIZ BOX */
.quiz-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px 15px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto 20px auto;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.5s ease;
}

h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.2rem;
    line-height: 1.4;
}

/* INPUT FIELD & BUTTON */
.input-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 400px;
    margin: 0 auto;
}

.input-box {
    width: 100%;
    padding: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    background: rgba(255,255,255,0.9);
    color: #000;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    outline: none;
    transition: all 0.25s;
}

.input-box:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    background: #fff;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #00e676;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.submit-btn:active {
    transform: scale(0.98);
}

/* FEEDBACK MSG */
.feedback {
    margin-top: 15px;
    font-size: 1.05rem;
    font-weight: bold;
    min-height: 28px;
    line-height: 1.4;
}

.text-correct { color: #00e676; }
.text-wrong { color: #ff5252; }

/* BẢNG THỐNG KÊ CÂU SAI */
.wrong-list-container {
    margin-top: 20px;
    text-align: left;
    background: rgba(0, 0, 0, 0.25);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.wrong-list-title {
    font-size: 1.1rem;
    color: #ff5252;
    margin-bottom: 10px;
    font-weight: bold;
    text-align: center;
}

.wrong-item {
    background: rgba(255, 82, 82, 0.15);
    border-left: 4px solid #ff5252;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    font-size: 0.95rem;
    line-height: 1.4;
}

.wrong-item span.user-ans {
    color: #ff8a80;
    text-decoration: line-through;
}

.wrong-item span.correct-ans {
    color: #69f0ae;
    font-weight: bold;
}

/* GRID TỰ ĐỘNG CO GIÃN */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
    gap: 10px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto;
}

.cell {
    background: linear-gradient(145deg, #ffffff, #dcdcdc);
    color: black;
    padding: 12px 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
}

.cell:hover { transform: translateY(-2px) scale(1.03); }
.cell:active { transform: scale(0.95); }

/* ANIMATIONS */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; }
}

.score {
    font-size: 1.1rem;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

.fade-out { animation: vanish 0.4s forwards; }

@keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.2); opacity: 0; }
}

@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .cell { padding: 8px 2px; font-size: 0.85rem; }
    h2 { font-size: 1.05rem; }
}
</style>
</head>

// TẠO CÂU HỎI ĐẢO 2 CHIỀU
let generatedQuestions = [];
vocabList.forEach(item => {
    generatedQuestions.push({
        prompt: item.en,
        type: "EN_TO_VI",
        answer: item.vi
    });
    generatedQuestions.push({
        prompt: item.vi[0],
        type: "VI_TO_EN",
        answer: [item.en]
    });
});

let questions = generatedQuestions.sort(() => Math.random() - 0.5);

let current = null;
let answered = Array(30).fill(null);
let wrongAnswersList = []; // MẢNG LƯU CÁC CÂU LÀM SAI

function createGrid(){
    let html="";
    for(let i=0;i<30;i++){
        html+=`<div class="cell" onclick="selectQ(${i})" id="cell${i}">${i+1}</div>`;
    }
    document.getElementById("grid").innerHTML=html;
}

function selectQ(index){
    if(answered[index]!==null) return; 

    current = index;
    loadQ();
}

function loadQ(){
    let q = questions[current];
    if(q.type === "EN_TO_VI") {
        document.getElementById("question").innerHTML = `Từ Tiếng Anh <b>"${q.prompt}"</b> nghĩa Tiếng Việt là gì?`;
    } else {
        document.getElementById("question").innerHTML = `Từ Tiếng Việt <b>"${q.prompt}"</b> trong Tiếng Anh là gì?`;
    }
    
    document.getElementById("quiz-content").style.display = "block";
    document.getElementById("feedback").innerHTML = "";
    
    let input = document.getElementById("user-input");
    input.value = "";
    input.disabled = false;
    input.focus();
}

function handleKeyPress(e) {
    if (e.key === "Enter") {
        checkAnswer();
    }
}

function normalizeStr(str) {
    return str.trim()
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/\s+/g, ' ');
}

function checkAnswer(){
    let input = document.getElementById("user-input");
    let rawInput = input.value;
    let userAns = normalizeStr(rawInput);

    if(!userAns) return;

    let q = questions[current];
    let isCorrect = q.answer.some(ans => normalizeStr(ans) === userAns);
    let cell = document.getElementById("cell" + current);
    let feedbackEl = document.getElementById("feedback");

    input.disabled = true;

    if(isCorrect){
        feedbackEl.className = "feedback text-correct";
        feedbackEl.innerText = "🎉 Chính xác! (+10 điểm)";
        totalScore += 10;
    } else {
        feedbackEl.className = "feedback text-wrong";
        feedbackEl.innerText = `❌ Sai rồi! Đáp án chấp nhận: "${q.answer[0]}"`;
        
        // LƯU CÂU SAI VÀO DANH SÁCH
        wrongAnswersList.push({
            num: current + 1,
            prompt: q.prompt,
            userAns: rawInput,
            correctAns: q.answer[0]
        });
    }

    updateScoreUI();

    setTimeout(()=>{
        cell.classList.add("fade-out");

        setTimeout(()=>{
            cell.style.visibility = "hidden";
        },400);

        document.getElementById("question").innerHTML = "👉 Chọn ô tiếp theo";
        document.getElementById("quiz-content").style.display = "none";
    }, 1500);

    answered[current] = true;
    checkFinish();
}

function checkFinish(){
    if(answered.every(x=>x!==null)){
        let maxScore = 300;
        let percentage = Math.round((totalScore / maxScore) * 100);
        
        let rankMsg = "";
        if(percentage >= 90) rankMsg = "🎉 Xuất sắc! Khả năng nhớ từ vựng rất tuyệt vời!";
        else if(percentage >= 70) rankMsg = "👍 Khá tốt! Hãy tiếp tục rèn luyện nhé!";
        else rankMsg = "💪 Cố gắng thêm nhé, hãy thử lại lượt mới!";

        document.getElementById("score").innerHTML =
            "<b>HOÀN THÀNH BÀI THI!</b><br>" +
            "Tổng điểm: " + totalScore + " / " + maxScore + " (" + percentage + "%)<br>" +
            rankMsg;

        // HIỂN THỊ DANH SÁCH CÂU SAI NẾU CÓ
        if(wrongAnswersList.length > 0) {
            let summaryHTML = `<div class="wrong-list-container">
                <div class="wrong-list-title">⚠️ Danh sách ${wrongAnswersList.length} câu bạn làm chưa đúng:</div>`;
            
            wrongAnswersList.forEach(item => {
                summaryHTML += `
                <div class="wrong-item">
                    <b>Ô số ${item.num}:</b> Từ <b>"${item.prompt}"</b><br>
                    • Bạn gõ: <span class="user-ans">${item.userAns}</span><br>
                    • Đáp án đúng: <span class="correct-ans">${item.correctAns}</span>
                </div>`;
            });

            summaryHTML += `</div>`;
            document.getElementById("wrong-summary").innerHTML = summaryHTML;
        } else {
            document.getElementById("wrong-summary").innerHTML = `<div style="color: #00e676; font-weight: bold; margin-top: 15px;">🌟 Bạn đã trả lời đúng 100% tất cả các câu! Tốt lắm!</div>`;
        }
    }
}

function updateScoreUI(){
    document.getElementById("player-score").innerText = "🏆 Điểm số: " + totalScore;
}

createGrid();
</script>
