<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
    padding: 15px 10px;
    margin: 0;
    min-height: 100vh;
}

/* KHUNG CHUNG */
.card-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px 15px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto 20px auto;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}
.card-box h2 {
    color: #ff5252;
    text-shadow:
    0 0 5px  #ff260036,
    0 0 10px #ff000034,
    0 0 20px #ac2d2d3a,
    0 0 40px #ff000033,
    0 0 80px #ff00003b;
}
.card-box h3{
    font-size: x-large;
    font-family: Georgia, 'Times New Roman', Times, serif;
    color: yellow;
    text-shadow:
    0 0 5px  #f5bc01,
    0 0 10px #faf603b4,
    0 0 20px #fce301c0,
    0 0 40px #f3c706ad,
    0 0 80px #e6bd06dc;
}
/* SCREEN 1: LOGIN & MODE SELECT */
.form-group {
    margin-bottom: 15px;
}

.input-style {
    width: 100%;
    max-width: 350px;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.9);
    color: #000;
    font-size: 1rem;
    font-weight: bold;
    text-align: center;
    outline: none;
}

.mode-btn-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
}

.btn-main {
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    color: white;
}

.btn-solo { background: #00e5ff; color: black; }
.btn-2v2 { background: #ff4081; color: white; }
.btn-main:hover { transform: scale(1.05); }

/* SCREEN 2: GAMEPLAY */
.player-box {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.player-card {
    padding: 10px 20px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 1rem;
    background: rgba(255,255,255,0.15);
    border: 2px solid transparent;
}

.player-card.active-turn {
    border-color: #00e5ff;
    box-shadow: 0 0 15px #00e5ff;
    background: rgba(0, 229, 255, 0.2);
}

.team-a { color: #00e5ff; }
.team-b { color: #ff5252; }

/* INPUT & BUTTON IN GAME */
.input-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 400px;
    margin: 0 auto;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #00e676;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

.feedback {
    margin-top: 15px;
    font-size: 1.05rem;
    font-weight: bold;
    min-height: 28px;
}

.text-correct { color: #00e676; }
.text-wrong { color: #ff5252; }

/* BẢNG THỐNG KÊ CÂU SAI */
.wrong-list-container {
    margin-top: 20px;
    text-align: left;
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 12px;
}

.wrong-item {
    background: rgba(255, 82, 82, 0.15);
    border-left: 4px solid #ff5252;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    font-size: 0.9rem;
}

/* GRID BOARD */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
    gap: 10px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto;
}

.cell {
    background: linear-gradient(145deg, #ffffff, #dcdcdc);
    color: black;
    padding: 12px 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.2s;
    user-select: none;
}

.fade-out { animation: vanish 0.4s forwards; }
@keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.2); opacity: 0; }
}

@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .cell { padding: 8px 2px; font-size: 0.85rem; }
}
</style>
</head>

let generatedQuestions = [];

    generatedQuestions.push({ prompt: item.en, type: "EN_TO_VI", answer: item.vi });
    generatedQuestions.push({ prompt: item.vi[0], type: "VI_TO_EN", answer: [item.en] });
});

let questions = generatedQuestions.sort(() => Math.random() - 0.5);
let current = null;
let answered = Array(30).fill(null);
let wrongAnswersList = [];

function startGame(mode) {
    let nameInput = document.getElementById("username").value.trim();
    if(nameInput) playerName = nameInput;
    gameMode = mode;

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";

    renderScoreboard();
    createGrid();
}

function renderScoreboard() {
    let sb = document.getElementById("scoreboard");
    if(gameMode === 'solo') {
        sb.innerHTML = `<div class="player-card active-turn team-a">👤 Người chơi: ${playerName} | 🏆 Điểm: <span id="val-scoreA">0</span></div>`;
    } else {
        sb.innerHTML = `
            <div id="card-teamA" class="player-card team-a active-turn">🔵 Đội A: <span id="val-scoreA">0</span> điểm</div>
            <div id="card-teamB" class="player-card team-b">🔴 Đội B: <span id="val-scoreB">0</span> điểm</div>
        `;
    }
}

function createGrid(){
    let html="";
    for(let i=0;i<30;i++){
        html+=`<div class="cell" onclick="selectQ(${i})" id="cell${i}">${i+1}</div>`;
    }
    document.getElementById("grid").innerHTML=html;
}

function selectQ(index){
    if(answered[index]!==null) return; 
    current = index;
    loadQ();
}

function loadQ(){
    let q = questions[current];
    let turnText = (gameMode === '2v2') ? `[Lượt Đội ${currentTeam}] ` : '';
    
    if(q.type === "EN_TO_VI") {
        document.getElementById("question").innerHTML = `${turnText}Từ Tiếng Anh <b>"${q.prompt}"</b> nghĩa Tiếng Việt là gì?`;
    } else {
        document.getElementById("question").innerHTML = `${turnText}Từ Tiếng Việt <b>"${q.prompt}"</b> trong Tiếng Anh là gì?`;
    }
    
    document.getElementById("quiz-content").style.display = "block";
    document.getElementById("feedback").innerHTML = "";
    
    let input = document.getElementById("user-input");
    input.value = "";
    input.disabled = false;
    input.focus();
}

function handleKeyPress(e) {
    if (e.key === "Enter") checkAnswer();
}

function normalizeStr(str) {
    return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ');
}

function checkAnswer(){
    let input = document.getElementById("user-input");
    let rawInput = input.value;
    let userAns = normalizeStr(rawInput);

    if(!userAns) return;

    let q = questions[current];
    let isCorrect = q.answer.some(ans => normalizeStr(ans) === userAns);
    let cell = document.getElementById("cell" + current);
    let feedbackEl = document.getElementById("feedback");

    input.disabled = true;

    if(isCorrect){
        feedbackEl.className = "feedback text-correct";
        feedbackEl.innerText = "🎉 Chính xác! (+10 điểm)";
        if(gameMode === 'solo' || currentTeam === 'A') scoreA += 10;
        else scoreB += 10;
    } else {
        feedbackEl.className = "feedback text-wrong";
        feedbackEl.innerText = `❌ Sai rồi! Đáp án đúng: "${q.answer[0]}"`;
        
        wrongAnswersList.push({
            num: current + 1,
            prompt: q.prompt,
            userAns: rawInput,
            correctAns: q.answer[0]
        });
    }

    updateScoreUI();

    setTimeout(()=>{
        cell.classList.add("fade-out");
        setTimeout(()=>{ cell.style.visibility = "hidden"; }, 400);

        // ĐỔI LƯỢT CHƠI (Nếu là 2v2)
        if(gameMode === '2v2') {
            currentTeam = (currentTeam === 'A') ? 'B' : 'A';
            document.getElementById("card-teamA").classList.toggle("active-turn", currentTeam === 'A');
            document.getElementById("card-teamB").classList.toggle("active-turn", currentTeam === 'B');
        }

        document.getElementById("question").innerHTML = "👉 Chọn ô tiếp theo";
        document.getElementById("quiz-content").style.display = "none";
    }, 1500);

    answered[current] = true;
    checkFinish();
}

function updateScoreUI(){
    let elA = document.getElementById("val-scoreA");
    if(elA) elA.innerText = scoreA;
    let elB = document.getElementById("val-scoreB");
    if(elB) elB.innerText = scoreB;
}

function checkFinish(){
    if(answered.every(x=>x!==null)){
        let resultMsg = "";
        
        if(gameMode === 'solo') {
            let percentage = Math.round((scoreA / 300) * 100);
            resultMsg = `<b>HOÀN THÀNH BÀI THI SOLO!</b><br>Tổng điểm của ${playerName}: ${scoreA} / 300 (${percentage}%)`;
        } else {
            let winner = "";
            if(scoreA > scoreB) winner = "🏆 ĐỘI A THẮNG CỘC!";
            else if(scoreB > scoreA) winner = "🏆 ĐỘI B THẮNG CỘC!";
            else winner = "🤝 HÀI ĐỘI HÒA NHAU!";

            resultMsg = `<b>KẾT QUẢ ĐẤU ĐỘI 2V2!</b><br>🔵 Đội A: ${scoreA} điểm | 🔴 Đội B: ${scoreB} điểm<br><br><span style="color: #00e5ff; font-size: 1.3rem;">${winner}</span>`;
        }

        document.getElementById("score").innerHTML = resultMsg;

        if(wrongAnswersList.length > 0) {
            let summaryHTML = `<div class="wrong-list-container"><div style="color: #ff5252; font-weight: bold; margin-bottom: 10px;">⚠️ Danh sách câu trả lời chưa chính xác:</div>`;
            wrongAnswersList.forEach(item => {
                summaryHTML += `
                <div class="wrong-item">
                    <b>Ô số ${item.num}:</b> Từ <b>"${item.prompt}"</b><br>
                    • Đã gõ: <span style="text-decoration: line-through; color: #ff8a80;">${item.userAns}</span> | Đáp án: <span style="color: #69f0ae; font-weight: bold;">${item.correctAns}</span>
                </div>`;
            });
            summaryHTML += `</div>`;
            document.getElementById("wrong-summary").innerHTML = summaryHTML;
        }
    }
}
</script>
