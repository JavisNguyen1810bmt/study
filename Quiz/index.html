<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Thêm meta viewport để hỗ trợ hiển thị chuẩn trên giao diện di động -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Tu Vung Tieng Anh - Solo Mode</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
    padding: 15px 10px;
    margin: 0;
    min-height: 100vh;
}

/* PLAYER BOX */
.player-box {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
}

.player {
    padding: 10px 24px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 18px;
    background: #00e5ff;
    color: black;
    box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
}

/* QUIZ BOX */
.quiz-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 20px 15px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto 20px auto;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.5s ease;
}

h2 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 1.15rem;
    line-height: 1.4;
}

/* GRID TỰ ĐỘNG THAY ĐỔI CỘT TÙY KÍCH THƯỚC MÀN HÌNH */
.grid {
    display: grid;
    /* Tự động chia cột linh hoạt: mỗi ô tối thiểu 50px */
    grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
    gap: 10px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto;
}

.cell {
    background: linear-gradient(145deg, #ffffff, #dcdcdc);
    color: black;
    padding: 12px 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.cell:hover {
    transform: translateY(-2px) scale(1.03);
}

.cell:active {
    transform: scale(0.95);
}

/* BUTTON */
.btn {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: white;
    color: black;
    font-weight: bold;
    font-size: 0.95rem;
    transition: 0.2s;
    -webkit-tap-highlight-color: transparent;
}

.btn:hover {
    transform: scale(1.02);
}

.btn:active {
    transform: scale(0.98);
}

.correct {
    background: #00e676 !important;
    color: white;
    animation: pop 0.3s;
}

.wrong {
    background: #ff5252 !important;
    color: white;
    animation: shake 0.3s;
}

/* ANIMATIONS */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; }
}

.score {
    font-size: 1.1rem;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

.fade-out {
    animation: vanish 0.4s forwards;
}

@keyframes vanish {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    100% {
        transform: scale(0.2);
        opacity: 0;
    }
}

/* TỐI ƯU CHO MÀN HÌNH NHỎ (ĐIỆN THOẠI < 480px) */
@media (max-width: 480px) {
    body {
        padding: 10px 8px;
    }

    .player {
        font-size: 16px;
        padding: 8px 18px;
    }

    .quiz-box {
        padding: 15px 12px;
        border-radius: 16px;
    }

    h2 {
        font-size: 1rem;
    }

    .btn {
        padding: 10px 12px;
        font-size: 0.9rem;
    }

    .grid {
        /* Trên màn hình nhỏ hiển thị cố định 6 cột đều đẹp */
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
    }

    .cell {
        padding: 8px 2px;
        font-size: 0.85rem;
        border-radius: 8px;
    }
}
</style>

// Tráo ngẫu nhiên toàn bộ câu hỏi
let questions = originalQuestions
    .map(q => shuffleAnswers(q)) 
    .sort(() => Math.random() - 0.5); 

let current = null;
let answered = Array(30).fill(null); 

// Tạo grid 30 ô
function createGrid(){
    let html="";
    for(let i=0;i<30;i++){
        html+=`<div class="cell" onclick="selectQ(${i})" id="cell${i}">${i+1}</div>`;
    }
    document.getElementById("grid").innerHTML=html;
}

function selectQ(index){
    if(answered[index]!==null) return; 

    current=index;
    loadQ();
}

function loadQ(){
    let q=questions[current];
    document.getElementById("question").innerHTML=q.q;

    let html="";
    q.a.forEach((ans,i)=>{
        html+=`<button class="btn" onclick="check(${i},this)">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML=html;
}

function check(i, btn){
    let correct = questions[current].c;
    let cell = document.getElementById("cell"+current);

    if(i===correct){
        btn.classList.add("correct");
        totalScore += 10;
    } else {
        btn.classList.add("wrong");
    }

    updateScoreUI();

    setTimeout(()=>{
        cell.classList.add("fade-out");

        setTimeout(()=>{
            cell.style.visibility = "hidden";
        },400);

        document.getElementById("question").innerHTML="👉 Chọn ô tiếp theo";
        document.getElementById("answers").innerHTML="";
    },600);

    answered[current] = true;
    checkFinish();
}

function checkFinish(){
    if(answered.every(x=>x!==null)){
        let maxScore = 300;
        let percentage = Math.round((totalScore / maxScore) * 100);
        
        let rankMsg = "";
        if(percentage >= 90) rankMsg = "🎉 Xuất sắc! Bạn đã thuộc rất kĩ từ vựng!";
        else if(percentage >= 70) rankMsg = "👍 Khá tốt! Hãy tiếp tục ôn luyện nhé!";
        else rankMsg = "💪 Cố gắng thêm nhé, hãy thử lại lượt mới!";

        document.getElementById("score").innerHTML =
            "<b>HOÀN THÀNH BÀI THI!</b><br>" +
            "Tổng điểm: " + totalScore + " / " + maxScore + " (" + percentage + "%)<br>" +
            rankMsg;
    }
}

function updateScoreUI(){
    document.getElementById("player-score").innerText = "🏆 Điểm số: " + totalScore;
}

createGrid();
