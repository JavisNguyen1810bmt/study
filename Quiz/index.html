<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
    padding: 15px 10px;
    margin: 0;
    min-height: 100vh;
}

/* ================= HAMBURGER MENU & DRAWER ================= */
.menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 1.5rem;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: 0.2s;
}
.menu-btn:hover { background: rgba(0, 229, 255, 0.4); }

.drawer-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1001;
    display: none;
    backdrop-filter: blur(3px);
}

.drawer {
    position: fixed;
    top: 0; left: -320px;
    width: 320px; height: 100%;
    background: #1a1829;
    z-index: 1002;
    transition: left 0.3s ease;
    box-shadow: 5px 0 25px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    text-align: left;
}

.drawer.open { left: 0; }

.drawer-header {
    padding: 20px 15px;
    background: rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.drawer-header h3 { margin: 0; color: #00e5ff; font-size: 1.2rem; }
.close-btn {
    background: none; border: none; color: white;
    font-size: 1.5rem; cursor: pointer;
}

.drawer-search {
    padding: 10px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.drawer-search input {
    width: 100%; padding: 8px 12px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1); color: white; outline: none;
}

.drawer-content {
    flex: 1; overflow-y: auto; padding: 15px;
}

.vocab-item-menu {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 0.9rem;
}
.vocab-item-menu b { color: #ff9800; }
.vocab-item-menu span { color: #ddd; font-size: 0.85rem; }

/* ================= KHUNG CHUNG ================= */
.card-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px 15px;
    max-width: 750px;
    width: 100%;
    margin: 0 auto 20px auto;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}
.card-box h2 {
    color: #ff5252;
    text-shadow: 0 0 5px #ff260036, 0 0 10px #ff000034;
}
.card-box h3{
    font-size: x-large;
    font-family: Georgia, 'Times New Roman', Times, serif;
    color: yellow;
}

/* INPUT & BUTTON */
.form-group { margin-bottom: 15px; }

.input-style {
    width: 100%; max-width: 350px; padding: 12px;
    border-radius: 12px; border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.9); color: #000;
    font-size: 1rem; font-weight: bold; text-align: center; outline: none;
}

.mode-btn-container {
    display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 20px;
}

.btn-main {
    padding: 12px 25px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: white;
}
.btn-solo { background: #00e5ff; color: black; }
.btn-2v2 { background: #ff4081; color: white; }
.btn-main:hover { transform: scale(1.05); }

/* GAMEPLAY */
.player-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
.player-card {
    padding: 10px 20px; border-radius: 15px; font-weight: bold; font-size: 1rem;
    background: rgba(255,255,255,0.15); border: 2px solid transparent;
}
.player-card.active-turn {
    border-color: #00e5ff; box-shadow: 0 0 15px #00e5ff; background: rgba(0, 229, 255, 0.2);
}
.team-a { color: #00e5ff; }
.team-b { color: #ff5252; }

.input-container { display: flex; flex-direction: column; gap: 12px; max-width: 450px; margin: 0 auto; }
.btn-action-group { display: flex; gap: 10px; }

.submit-btn {
    flex: 2; padding: 12px; border: none; border-radius: 12px;
    background: #00e676; color: white; font-size: 1rem; font-weight: bold; cursor: pointer;
}
.hint-btn {
    flex: 1; padding: 12px; border: none; border-radius: 12px;
    background: #ff9800; color: white; font-size: 0.95rem; font-weight: bold; cursor: pointer;
}
.hint-box {
    background: rgba(255, 235, 59, 0.2); border: 1px dashed #ffeb3b;
    color: #fffde7; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; display: none;
}

/* NÚT ANKI */
.anki-container {
    display: none; margin-top: 15px; background: rgba(0, 0, 0, 0.4);
    padding: 15px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.2);
}
.anki-title { font-size: 0.9rem; color: #ffd54f; margin-bottom: 10px; font-weight: bold; }
.anki-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.anki-btn {
    padding: 10px 5px; border: none; border-radius: 8px; font-weight: bold;
    font-size: 0.85rem; cursor: pointer; color: white; transition: 0.2s;
}
.anki-btn span { display: block; font-size: 0.75rem; opacity: 0.8; font-weight: normal; }
.btn-again { background: #f44336; }
.btn-hard { background: #ff9800; }
.btn-good { background: #2196f3; }
.btn-easy { background: #4caf50; }

.feedback { margin-top: 15px; font-size: 1.05rem; font-weight: bold; min-height: 28px; }
.text-correct { color: #00e676; }
.text-wrong { color: #ff5252; }

/* BẢNG THỐNG KÊ */
.wrong-list-container { margin-top: 20px; text-align: left; background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 12px; }
.wrong-item { background: rgba(255, 255, 255, 0.08); border-left: 4px solid #00e5ff; padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 0.9rem; }

/* GRID BOARD */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 10px; max-width: 750px; width: 100%; margin: 0 auto; }
.cell { background: linear-gradient(145deg, #ffffff, #dcdcdc); color: black; padding: 12px 5px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.2s; user-select: none; }
.fade-out { animation: vanish 0.4s forwards; }
@keyframes vanish { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.2); opacity: 0; } }

@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .cell { padding: 8px 2px; font-size: 0.85rem; }
    .anki-btn-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <div class="score" id="score"></div>
        <div id="wrong-summary"></div>
    </div>

    <div id="grid" class="grid"></div>
</div>

// FUNCTION LOGIC FOR HAMBURGER MENU
function toggleMenu() {
    let drawer = document.getElementById("drawer");
    let overlay = document.getElementById("drawer-overlay");
    if(drawer.classList.contains("open")) {
        drawer.classList.remove("open");
        overlay.style.display = "none";
    } else {
        drawer.classList.add("open");
        overlay.style.display = "block";
        renderMenuVocabList(vocabList);
    }
}

function renderMenuVocabList(list) {
    let container = document.getElementById("drawer-vocab-list");
    let html = "";
    list.forEach((item, index) => {
        html += `
        <div class="vocab-item-menu">
            <b>${index + 1}. ${item.en}</b><br>
            <span>• ${item.vi[0]}</span>
        </div>`;
    });
    container.innerHTML = html;
}

function filterMenuVocab() {
    let rawInput = document.getElementById("menu-search-input").value.trim();
    if (!rawInput) {
        renderMenuVocabList(vocabList);
        return;
    }

    // Chuẩn hóa chuỗi tìm kiếm (xóa dấu tiếng Việt & chuyển về chữ thường)
    let searchNoAccent = rawInput.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    // Kiểm tra xem người dùng có phải đang nhập thuần SỐ hay không
    let isNumber = /^\d+$/.test(rawInput);

    let filtered = vocabList.filter((item, index) => {
        let wordNumber = index + 1; // Số thứ tự từ 1 đến 180

        // 1. TÌM THEO SỐ: Phải khớp CHÍNH XÁC số thứ tự
        if (isNumber) {
            return wordNumber === parseInt(rawInput, 10);
        }

        // 2. TÌM THEO CHỮ: So sánh Tiếng Anh hoặc Tiếng Việt (Không phân biệt có/không dấu)
        let enWord = item.en.toLowerCase();
        let matchVi = item.vi.some(v => 
            v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(searchNoAccent)
        );

        return enWord.includes(searchNoAccent) || matchVi;
    });

    renderMenuVocabList(filtered);
}


// MAIN QUIZ LOGIC
let generatedQuestions = [];
vocabList.forEach(item => {
    generatedQuestions.push({ prompt: item.en, type: "EN_TO_VI", answer: item.vi });
    generatedQuestions.push({ prompt: item.vi[0], type: "VI_TO_EN", answer: [item.en] });
});

let questions = generatedQuestions.sort(() => Math.random() - 0.5);
let current = null;
let answered = Array(30).fill(null);
let wrongAnswersList = [];
let ankiReviewList = []; 
let hintLevel = 0;

function startGame(mode) {
    let nameInput = document.getElementById("username").value.trim();
    if(nameInput) playerName = nameInput;
    gameMode = mode;

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";

    renderScoreboard();
    createGrid();
}

function renderScoreboard() {
    let sb = document.getElementById("scoreboard");
    if(gameMode === 'solo') {
        sb.innerHTML = `<div class="player-card active-turn team-a">👤 Người chơi: ${playerName} | 🏆 Điểm: <span id="val-scoreA">0</span></div>`;
    } else {
        sb.innerHTML = `
            <div id="card-teamA" class="player-card team-a active-turn">🔵 Đội A: <span id="val-scoreA">0</span> điểm</div>
            <div id="card-teamB" class="player-card team-b">🔴 Đội B: <span id="val-scoreB">0</span> điểm</div>
        `;
    }
}

function createGrid(){
    let html="";
    for(let i=0;i<30;i++){
        html+=`<div class="cell" onclick="selectQ(${i})" id="cell${i}">${i+1}</div>`;
    }
    document.getElementById("grid").innerHTML=html;
}

function selectQ(index){
    if(answered[index]!==null) return; 
    current = index;
    loadQ();
}

function loadQ(){
    let q = questions[current];
    let turnText = (gameMode === '2v2') ? `[Lượt Đội ${currentTeam}] ` : '';
    
    if(q.type === "EN_TO_VI") {
        document.getElementById("question").innerHTML = `${turnText}Từ Tiếng Anh <b>"${q.prompt}"</b> nghĩa Tiếng Việt là gì?`;
    } else {
        document.getElementById("question").innerHTML = `${turnText}Từ Tiếng Việt <b>"${q.prompt}"</b> trong Tiếng Anh là gì?`;
    }
    
    document.getElementById("quiz-content").style.display = "block";
    document.getElementById("feedback").innerHTML = "";
    document.getElementById("anki-selector").style.display = "none";
    document.getElementById("normal-btn-group").style.display = "flex";
    
    hintLevel = 0;
    let hintBox = document.getElementById("hint-box");
    hintBox.style.display = "none";
    hintBox.innerHTML = "";
    document.getElementById("btn-hint").disabled = false;
    document.getElementById("btn-hint").innerText = "💡 Gợi ý";
    
    let input = document.getElementById("user-input");
    input.value = "";
    input.disabled = false;
    input.focus();
}

function showHint() {
    let q = questions[current];
    let target = q.answer[0]; 
    let hintBox = document.getElementById("hint-box");
    hintBox.style.display = "block";

    hintLevel++;

    if(hintLevel === 1) {
        let firstChar = target.charAt(0);
        hintBox.innerHTML = `💡 <b>Gợi ý 1:</b> Bắt đầu bằng chữ <b>"${firstChar.toUpperCase()}"</b> (${target.length} ký tự)`;
        document.getElementById("btn-hint").innerText = "💡 Gợi ý thêm";
    } else if(hintLevel === 2) {
        let firstChar = target.charAt(0);
        let lastChar = target.charAt(target.length - 1);
        hintBox.innerHTML = `💡 <b>Gợi ý 2:</b> Bắt đầu bằng <b>"${firstChar.toUpperCase()}"</b> và kết thúc bằng <b>"${lastChar.toUpperCase()}"</b>`;
        document.getElementById("btn-hint").disabled = true;
        document.getElementById("btn-hint").innerText = "Hết gợi ý";
    }
}

function handleKeyPress(e) { if (e.key === "Enter") checkAnswer(); }

function normalizeStr(str) {
    return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ');
}

function checkAnswer(){
    let input = document.getElementById("user-input");
    let rawInput = input.value;
    let userAns = normalizeStr(rawInput);

    if(!userAns) return;

    let q = questions[current];
    let isCorrect = q.answer.some(ans => normalizeStr(ans) === userAns);
    let feedbackEl = document.getElementById("feedback");

    input.disabled = true;
    document.getElementById("btn-hint").disabled = true;

    if(isCorrect){
        let earnedPoints = 10;
        if(hintLevel === 1) earnedPoints = 7;
        else if(hintLevel === 2) earnedPoints = 5;

        feedbackEl.className = "feedback text-correct";
        feedbackEl.innerText = `🎉 Chính xác! (+${earnedPoints} điểm)`;
        
        if(gameMode === 'solo' || currentTeam === 'A') scoreA += earnedPoints;
        else scoreB += earnedPoints;
    } else {
        feedbackEl.className = "feedback text-wrong";
        feedbackEl.innerText = `❌ Sai rồi! Đáp án đúng: "${q.answer[0]}"`;
        
        wrongAnswersList.push({
            num: current + 1,
            prompt: q.prompt,
            userAns: rawInput,
            correctAns: q.answer[0]
        });
    }

    updateScoreUI();

    document.getElementById("normal-btn-group").style.display = "none";
    document.getElementById("anki-selector").style.display = "block";
}

function submitAnkiRating(rating) {
    let q = questions[current];
    let cell = document.getElementById("cell" + current);

    let repeatTimeText = "";
    if(rating === 'again') repeatTimeText = "5 - 7 phút sau";
    else if(rating === 'hard') repeatTimeText = "15 - 30 phút sau";
    else if(rating === 'good') repeatTimeText = "1 - 2 tiếng sau";
    else if(rating === 'easy') repeatTimeText = "2 - 3 ngày sau";

    ankiReviewList.push({
        word: q.prompt,
        ans: q.answer[0],
        rating: rating.toUpperCase(),
        nextReview: repeatTimeText
    });

    if(rating === 'again' || rating === 'hard') {
        questions.push(q);
    }

    cell.classList.add("fade-out");
    setTimeout(()=>{ cell.style.visibility = "hidden"; }, 400);

    if(gameMode === '2v2') {
        currentTeam = (currentTeam === 'A') ? 'B' : 'A';
        document.getElementById("card-teamA").classList.toggle("active-turn", currentTeam === 'A');
        document.getElementById("card-teamB").classList.toggle("active-turn", currentTeam === 'B');
    }

    document.getElementById("question").innerHTML = "👉 Chọn ô tiếp theo";
    document.getElementById("quiz-content").style.display = "none";

    answered[current] = true;
    checkFinish();
}

function updateScoreUI(){
    let elA = document.getElementById("val-scoreA");
    if(elA) elA.innerText = scoreA;
    let elB = document.getElementById("val-scoreB");
    if(elB) elB.innerText = scoreB;
}

function checkFinish(){
    if(answered.every(x=>x!==null)){
        let resultMsg = "";
        
        if(gameMode === 'solo') {
            let percentage = Math.round((scoreA / 300) * 100);
            resultMsg = `<b>HOÀN THÀNH BÀI THI SOLO!</b><br>Tổng điểm của ${playerName}: ${scoreA} / 300 (${percentage}%)`;
        } else {
            let winner = "";
            if(scoreA > scoreB) winner = "🏆 ĐỘI A THẮNG CỘC!";
            else if(scoreB > scoreA) winner = "🏆 ĐỘI B THẮNG CỘC!";
            else winner = "🤝 HAI ĐỘI HÒA NHAU!";

            resultMsg = `<b>KẾT QUẢ ĐẤU ĐỘI 2V2!</b><br>🔵 Đội A: ${scoreA} điểm | 🔴 Đội B: ${scoreB} điểm<br><br><span style="color: #00e5ff; font-size: 1.3rem;">${winner}</span>`;
        }

        document.getElementById("score").innerHTML = resultMsg;

        let summaryHTML = "";
        if(ankiReviewList.length > 0) {
            summaryHTML += `<div class="wrong-list-container"><div style="color: #ffd54f; font-weight: bold; margin-bottom: 10px;">🧠 Bảng tổng hợp thuật toán lặp lại (Anki SRS):</div>`;
            ankiReviewList.forEach(item => {
                let badgeColor = "#ff9800";
                if(item.rating === "AGAIN") badgeColor = "#f44336";
                if(item.rating === "GOOD") badgeColor = "#2196f3";
                if(item.rating === "EASY") badgeColor = "#4caf50";

                summaryHTML += `
                <div class="wrong-item">
                    Từ <b>"${item.word}"</b> (${item.ans}) <br>
                    • Mức độ: <span style="background:${badgeColor}; padding: 2px 6px; border-radius:4px; font-size:0.8rem;">${item.rating}</span> 
                    | 🔄 Lặp lại sau: <b>${item.nextReview}</b>
                </div>`;
            });
            summaryHTML += `</div>`;
        }

        document.getElementById("wrong-summary").innerHTML = summaryHTML;
    }
}
